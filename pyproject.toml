[project]
name = "support-copilot"
version = "0.1.0"
description = "MCP server that prepares policy-checked support replies for human review"
authors = [
    { name = "Barney Nguyen", email = "huu.thonguyen76@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
support-copilot = "support_copilot.server:main"
support-review = "support_copilot.review:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
